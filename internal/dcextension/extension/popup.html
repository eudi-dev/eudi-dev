<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eudi-dev Digital Credentials</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #1a1b26; --dim: #565f89; --border: #c0c4d6; --accent: #3d59a1; --ok: #2e7d32; --bad: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1b26; --text: #c0caf5; --dim: #9aa5ce; --border: #414868; --accent: #7aa2f7; --ok: #9ece6a; --bad: #f7768e; } }
    body { margin: 0; padding: 14px 16px; width: 320px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
    h1 img { width: 20px; height: 20px; }
    label { display: block; font-weight: 600; color: var(--dim); margin-bottom: 4px; }
    input { box-sizing: border-box; width: 100%; padding: 6px 8px; font: 12px ui-monospace, monospace; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 6px; }
    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    button { font: inherit; font-weight: 600; padding: 5px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    a { color: var(--accent); }
    #status { margin-top: 10px; color: var(--dim); }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    p { margin: 10px 0 0; color: var(--dim); }
    .switch-row { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; }
    .switch-row + label { margin-top: 0; }
    #status + .switch-row { margin: 12px 0 0; }
    .switch-row label { margin: 0; font-weight: 600; color: var(--text); }
    .switch { appearance: none; position: relative; flex: none; width: 34px; height: 20px; margin: 0 0 0 auto; padding: 0; border: 0; border-radius: 10px; background: var(--border); cursor: pointer; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(14px); }
    .switch:focus-visible, .info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .info { position: relative; flex: none; width: 16px; height: 16px; border: 1px solid var(--dim); border-radius: 50%; color: var(--dim); font: 600 11px/16px system-ui, sans-serif; text-align: center; cursor: help; }
    .info:hover, .info:focus { border-color: var(--accent); color: var(--accent); }
    .info:hover::after, .info:focus::after { content: attr(data-tip); position: absolute; z-index: 1; top: 22px; left: -80px; width: 210px; padding: 6px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font-weight: 400; font-size: 12px; line-height: 1.35; text-align: left; }
  </style>
</head>
<body>
  <h1><img src="icons/32.png" alt="">eudi-dev Digital Credentials</h1>
  <div class="switch-row">
    <label for="enabled">Answer calls</label>
    <span class="info" tabindex="0" role="img" aria-label="Off: pages get the browser's own API. Reload open pages after a change." data-tip="Off: pages get the browser's own API. Reload open pages after a change.">i</span>
    <input id="enabled" class="switch" type="checkbox" role="switch">
  </div>
  <label for="wallet-url">Wallet URL</label>
  <input id="wallet-url" type="url" spellcheck="false">
  <div class="row">
    <button id="save" type="button">Save</button>
    <a id="open" href="#" target="_blank" rel="noopener">Open the wallet</a>
  </div>
  <div id="status"></div>
  <div class="switch-row">
    <label for="console-log">Log to the page console</label>
    <input id="console-log" class="switch" type="checkbox" role="switch">
  </div>
  <script src="popup.js"></script>
</body>
</html>
