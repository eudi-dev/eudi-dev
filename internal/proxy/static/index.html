<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUDI Dev Proxy</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <header>
    <h1 id="header-title">EUDI Dev Proxy</h1>
    <div class="header-right">
      <span id="status" class="status">Connected</span>
      <label class="checkbox-label" id="show-all-label" title="Show non-OID4VP/VCI traffic">
        <input type="checkbox" id="show-all"> All traffic
      </label>
      <button class="btn" id="har-export">Export HAR</button>
      <button class="btn" id="timeline-toggle">Timeline</button>
      <button class="btn" id="theme-toggle" data-theme-toggle>Theme</button>
      <button class="btn" id="clear-btn">Clear</button>
    </div>
  </header>
  <div class="entries" id="entries">
    <div class="empty-state" id="empty">Waiting for traffic...</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
