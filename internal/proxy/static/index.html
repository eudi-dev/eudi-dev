<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OID4VC Dev Proxy</title>
  <link rel="stylesheet" href="fonts/plex.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>OID4VC Dev Proxy</h1>
    <div class="header-right">
      <span id="status" class="status">Connected</span>
      <label class="checkbox-label" title="Show non-OID4VP/VCI traffic">
        <input type="checkbox" id="show-all"> All traffic
      </label>
      <button class="btn" id="har-export">Export HAR</button>
      <button class="btn" id="timeline-toggle">Timeline</button>
      <button class="btn" id="theme-toggle">Theme</button>
      <button class="btn" id="clear-btn">Clear</button>
    </div>
  </header>
  <div class="entries" id="entries">
    <div class="empty-state" id="empty">Waiting for traffic...</div>
  </div>
  <footer class="app-footer">
    <div class="sponsor-info">
      <span>Enjoying eudi-dev?</span>
      <a href="https://github.com/sponsors/dominikschlosser" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        Support its development
      </a>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
