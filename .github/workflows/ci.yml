name: CI

on:
  push:
    branches: [main, '*.*.x']
  pull_request:
    branches: [main, '*.*.x']

# EUDI_DEV_STORAGE selects the backend for tests, wallet servers and CLI commands.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage:
          - name: file
            spec: ""
          - name: memory
            spec: memory
          - name: postgres
            spec: postgres://postgres:postgres@localhost:5432/eudi?sslmode=disable
    name: build-and-test (${{ matrix.storage.name }})
    env:
      EUDI_DEV_STORAGE: ${{ matrix.storage.spec }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eudi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -v ./...

      # Platform files such as the macOS URL handler would otherwise first
      # compile in the release workflow.
      - name: Cross-compile for macOS and Windows
        if: matrix.storage.name == 'file'
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: Test versioned Go installation
        if: matrix.storage.name == 'file'
        run: python3 scripts/test_go_install.py

      - name: Vet
        if: matrix.storage.name == 'file'
        run: |
          echo '## `go vet`' >> "$GITHUB_STEP_SUMMARY"
          if output=$(go vet ./... 2>&1); then
            echo '✅ No issues found' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$output"
            exit 1
          fi

      - name: Install golangci-lint
        if: matrix.storage.name == 'file'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2

      - name: Lint
        if: matrix.storage.name == 'file'
        run: |
          echo '## Lint (golangci-lint)' >> "$GITHUB_STEP_SUMMARY"
          if output=$(golangci-lint run ./... 2>&1); then
            echo '✅ No issues found' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$output"
            exit 1
          fi

      # The URL handler test asks xdg-mime for the registered default handler.
      - name: Install xdg-utils
        run: command -v xdg-mime || (sudo apt-get update -qq && sudo apt-get install -y -qq xdg-utils)

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      # Background resets and deferred issuance share state with request handlers.
      # Races can corrupt signatures without crashing the process.
      - name: Test with the race detector
        run: go test -race ./...

      # The benchmarks run once, so a broken setup fails in CI before anyone measures.
      - name: Run the benchmarks once
        if: matrix.storage.name == 'file'
        run: go test ./internal/wallet -run '^$' -bench . -benchtime 1x

      - name: Coverage summary
        if: matrix.storage.name == 'file'
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Filter coverage
        if: matrix.storage.name == 'file'
        run: |
          grep -v -E '/(cmd/|main\.go:|internal/output/printer\.go:|internal/proxy/(subprocess|terminal|dashboard)\.go:|internal/wallet/server\.go:|internal/urlhandler/register_darwin\.go:|internal/qr/screen\.go:|internal/format/input\.go:|internal/web/handler\.go:)' coverage.out > coverage-filtered.out || true

      - name: Upload coverage
        if: matrix.storage.name == 'file'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-filtered.out

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage:
          - name: file
            spec: ""
          - name: memory
            spec: memory
          - name: postgres
            spec: postgres://postgres:postgres@localhost:5432/eudi?sslmode=disable
    name: e2e (${{ matrix.storage.name }})
    env:
      EUDI_DEV_STORAGE: ${{ matrix.storage.spec }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eudi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.storage.name }}
          path: e2e/test-results/
