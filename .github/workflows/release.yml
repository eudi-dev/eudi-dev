name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # A tag with a suffix, such as v3.0.0-beta.1, is a prerelease. latest goes
  # to the newest stable release and beta to the newest release of all, so a
  # maintenance release of an older line moves neither.
  channels:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channels.outputs.prerelease }}
      latest: ${{ steps.channels.outputs.latest }}
      beta: ${{ steps.channels.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the release channels
        id: channels
        run: |
          tag="${GITHUB_REF_NAME}"
          # versionsort.suffix sorts v3.0.0-beta.1 before v3.0.0.
          newest() {
            git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | grep -E "$1" | head -1
          }
          prerelease=false
          [[ "${tag}" == *-* ]] && prerelease=true
          latest=false
          [[ "${prerelease}" == false && "$(newest '^v[0-9]+\.[0-9]+\.[0-9]+$')" == "${tag}" ]] && latest=true
          beta=false
          [[ "$(newest '^v[0-9]')" == "${tag}" ]] && beta=true
          {
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
            echo "beta=${beta}"
          } >> "$GITHUB_OUTPUT"
          echo "${tag}: prerelease=${prerelease} latest=${latest} beta=${beta}"

  release:
    runs-on: ubuntu-latest
    needs: channels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X github.com/eudi-dev/eudi-dev/v3/cmd.Version=${VERSION}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="eudi-${VERSION}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}" .
          done

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: ${{ needs.channels.outputs.latest }}
          prerelease: ${{ needs.channels.outputs.prerelease }}
          files: |
            dist/*

  docker:
    runs-on: ubuntu-latest
    needs: channels
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ needs.channels.outputs.latest == 'true' && 'ghcr.io/eudi-dev/eudi-dev:latest' || '' }}
            ${{ needs.channels.outputs.beta == 'true' && 'ghcr.io/eudi-dev/eudi-dev:beta' || '' }}
            ghcr.io/eudi-dev/eudi-dev:${{ steps.version.outputs.tag }}

  homebrew:
    # The tap installs the newest stable release only.
    if: ${{ needs.channels.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    needs: [channels, release]
    steps:
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY not configured, skipping Homebrew tap update"
            exit 0
          fi
          # A deploy key with write access to eudi-dev/homebrew-tap only.
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          TARBALL_URL="https://github.com/eudi-dev/eudi-dev/archive/refs/tags/${TAG}.tar.gz"
          curl -sL -o source.tar.gz "$TARBALL_URL"
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)

          git clone git@github.com:eudi-dev/homebrew-tap.git tap
          git clone --depth 1 --branch "$TAG" https://github.com/eudi-dev/eudi-dev.git src
          mkdir -p tap/Formula
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA256}/" \
            src/packaging/homebrew/eudi-dev.rb.tmpl > tap/Formula/eudi-dev.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/eudi-dev.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "eudi-dev ${VERSION}"
          git push
