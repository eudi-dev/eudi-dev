name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X github.com/eudi-dev/eudi-dev/v2/cmd.Version=${VERSION}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            output="eudi-${VERSION}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${output}" .
          done

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref_name, 'v2.3.') && 'false' || 'true' }}
          prerelease: ${{ startsWith(github.ref_name, 'v2.3.') }}
          files: |
            dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ !startsWith(github.ref_name, 'v2.3.') && 'ghcr.io/eudi-dev/eudi-dev:latest' || '' }}
            ghcr.io/eudi-dev/eudi-dev:${{ steps.version.outputs.tag }}

  homebrew:
    # The tap follows the current release rather than 2.3.x maintenance releases.
    if: ${{ !startsWith(github.ref_name, 'v2.3.') }}
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY not configured, skipping Homebrew tap update"
            exit 0
          fi
          # A deploy key with write access to eudi-dev/homebrew-tap only.
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          TARBALL_URL="https://github.com/eudi-dev/eudi-dev/archive/refs/tags/${TAG}.tar.gz"
          curl -sL -o source.tar.gz "$TARBALL_URL"
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)

          git clone git@github.com:eudi-dev/homebrew-tap.git tap
          git clone --depth 1 --branch "$TAG" https://github.com/eudi-dev/eudi-dev.git src
          mkdir -p tap/Formula
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA256}/" \
            src/packaging/homebrew/eudi-dev.rb.tmpl > tap/Formula/eudi-dev.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/eudi-dev.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "eudi-dev ${VERSION}"
          git push
