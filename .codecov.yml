# Exclude CLI wiring, process management and UI lifecycle code from coverage.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%

# Match go.mod so coverage paths become relative before applying ignore patterns.
fixes:
  - "github.com/eudi-dev/eudi-dev/v2/::"

ignore:
  - "main.go"
  - "cmd/.*"
  # Example applications are outside the installed CLI.
  - "examples/.*"
  - "internal/output/printer.go"
  - "internal/proxy/subprocess.*"
  - "internal/proxy/terminal.go"
  - "internal/proxy/dashboard.go"
  - "internal/wallet/register_darwin.go"
  - "internal/wallet/server.go"
  - "internal/qr/screen.go"
  - "internal/format/input.go"
  - "internal/web/handler.go"
