# This example reuses the local web wallet setup with a public wallet. Keycloak must be
# reachable from that wallet, so start.sh supplies an ngrok origin through
# KEYCLOAK_PUBLIC_URL. The wallet uses publicly trusted HTTPS and needs no additional
# TLS truststore.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      - --import-realm
      # The create-credential-offer REST endpoint needs its own feature flag.
      - --features=oid4vc-vci:v1,oid4vc-vci-preauth-code:v1,oid4vc-vci-rest-credential-offer:v1
      - --http-port=${KEYCLOAK_PORT:-9080}
      # ngrok terminates TLS. Forwarded headers let Keycloak generate URLs for the public
      # origin.
      - --proxy-headers=xforwarded
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info,de.arbeitsagentur:trace
    ports:
      - "${KEYCLOAK_PORT:-9080}:${KEYCLOAK_PORT:-9080}"
      - "${APP_PORT:-9090}:${APP_PORT:-9090}"
    volumes:
      - ../keycloak-web-wallet/providers:/opt/keycloak/providers:ro
      - ../keycloak-web-wallet/realm:/opt/keycloak/data/import:ro

  app:
    build: ../keycloak-web-wallet/demo
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    command: ["/app/app.py"]
    environment:
      # Use the public Keycloak origin so generated offers and requests are reachable from
      # the public wallet.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_PUBLIC_URL:?empty, run start.sh (it starts the tunnel and sets the public URL)}
      WALLET_BASE_URL: ${WALLET_BASE_URL:-https://eudi-test.dev}
      APP_LISTEN_PORT: ${APP_PORT:-9090}
      APP_BASE_URL: http://localhost:${APP_PORT:-9090}
    volumes:
      - ../keycloak-web-wallet/scripts:/scripts:ro
      - ../keycloak-web-wallet/app:/app:ro

  demo:
    profiles: ["demo"]
    build: ../keycloak-web-wallet/demo
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    environment:
      # Administrative calls and health checks can use localhost without the tunnel.
      KEYCLOAK_BASE_URL: http://localhost:${KEYCLOAK_PORT:-9080}
      WALLET_BASE_URL: ${WALLET_BASE_URL:-https://eudi-test.dev}
    volumes:
      - ../keycloak-web-wallet/scripts:/scripts:ro
