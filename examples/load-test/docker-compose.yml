# Two wallet servers share Postgres behind nginx. Load tests can reach either server
# through one URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  wallet-1: &wallet
    image: ghcr.io/eudi-dev/eudi-dev:${WALLET_TAG:-latest}
    build:
      context: ../..
    # The state persists in the database, so the wallet generates its own random keys.
    environment:
      EUDI_DEV_STORAGE: postgres://postgres:wallet@db:5432/wallet?sslmode=disable
      EUDI_DEV_SEED: ""
    # The load generator's verifier callback runs on this machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/"]
      interval: 2s
      timeout: 3s
      retries: 30
    # The base URL is the ingress address visible to host clients. HTTPS uses port 8086.
    # nginx forwards it unchanged.
    command:
      - wallet
      - serve
      - --auto-accept
      - --pid
      - --port
      - "8085"
      - --base-url
      - http://localhost:${INGRESS_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy

  # The second server starts after the first is healthy, so only one of them
  # generates the PID baseline.
  wallet-2:
    <<: *wallet
    depends_on:
      db:
        condition: service_healthy
      wallet-1:
        condition: service_healthy

  ingress:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # INGRESS_PORT moves the HTTP host port. The HTTPS host port has to stay
    # 8086 because the wallets advertise that port.
    ports:
      - "${INGRESS_PORT:-8080}:8080"
      - "8086:8081"
    # Wait for both wallets so the ingress cannot forward to a server that is still
    # starting.
    depends_on:
      wallet-1:
        condition: service_healthy
      wallet-2:
        condition: service_healthy
