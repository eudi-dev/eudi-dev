<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../../internal/webui/fonts/IBMPlexSans-Regular-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../../internal/webui/fonts/IBMPlexSans-SemiBold-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 700; src: url("../../../internal/webui/fonts/IBMPlexSans-Bold-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../../internal/webui/fonts/IBMPlexMono-Regular-Latin1.woff2") format("woff2"); }
  :root { --bg:#17191e; --surface:#21242a; --line:#383d45; --text:#eceef1; --dim:#a9afb9; --accent:#8fb4ff; --ok:#9fdcae; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 400px; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", sans-serif; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 400px; padding: 44px 56px; display: flex; flex-direction: column;
    background: radial-gradient(760px 460px at 1100px -80px, rgba(143,180,255,0.20), transparent 70%),
      radial-gradient(560px 380px at -100px 720px, rgba(159,220,174,0.10), transparent 70%), var(--bg); }
  .top { display: flex; align-items: center; gap: 14px; }
  .top img { width: 40px; height: 45px; }
  .brand { font-size: 22px; font-weight: 700; }
  h1 { margin-top: 30px; font-size: 68px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { margin-top: 12px; font-size: 26px; color: var(--dim); }
  .grid { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
  .tile b { color: var(--text); font-size: 20px; font-weight: 600; }
  .tile span { color: var(--dim); font-size: 17px; line-height: 1.35; }
  .foot { margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; font-family: "IBM Plex Mono", monospace; }
  .site { font-size: 22px; color: var(--accent); }
  .gh { font-size: 15px; color: var(--dim); }
</style></head>
<body><div class="card">
  <div class="top"><img src="logo-mark.svg" alt=""><div class="brand">EUDI Dev Wallet</div></div>
  <h1>eudi-dev <span>3.0</span></h1>
  <div class="sub">Test the trust side of the EUDI Wallet ecosystem</div>
  <div class="foot"><div class="site">eudi-test.dev</div><div class="gh">open source · github.com/eudi-dev/eudi-dev</div></div>
</div></body></html>
