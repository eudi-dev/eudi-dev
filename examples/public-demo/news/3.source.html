<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../../internal/webui/fonts/IBMPlexSans-Regular-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../../internal/webui/fonts/IBMPlexSans-SemiBold-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 700; src: url("../../../internal/webui/fonts/IBMPlexSans-Bold-Latin1.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../../internal/webui/fonts/IBMPlexMono-Regular-Latin1.woff2") format("woff2"); }
  :root { --bg:#17191e; --line:#383d45; --text:#eceef1; --dim:#a9afb9; --accent:#8fb4ff; --ok:#9fdcae; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 627px; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", sans-serif; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 627px; overflow: hidden;
    background: radial-gradient(620px 520px at 900px 300px, rgba(143,180,255,0.30), transparent 70%),
      radial-gradient(520px 420px at 80px 640px, rgba(159,220,174,0.14), transparent 70%),
      linear-gradient(135deg, #1b1e25, #15171b); }
  .copy { position: absolute; left: 56px; top: 52px; width: 500px; z-index: 5; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 36px; height: 40px; }
  .brand { font-size: 20px; font-weight: 700; }
  h1 { margin-top: 40px; font-size: 64px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
  h1 span { display: block; background: linear-gradient(90deg, #8fb4ff, #9fdcae); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 24px; line-height: 1.3; color: var(--dim); }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { padding: 7px 14px; border-radius: 999px; font-size: 15px; font-weight: 600; background: rgba(143,180,255,0.14); color: #c9d8ff; border: 1px solid rgba(143,180,255,0.35); }
  .site { position: absolute; left: 56px; bottom: 44px; font-family: "IBM Plex Mono", monospace; font-size: 20px; color: var(--accent); z-index: 5; }
  .shot { position: absolute; border-radius: 16px; overflow: hidden; border: 1px solid #3a3f47;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03); background: #24272d; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .s1 { left: 600px; top: 40px; width: 380px; height: 330px; transform: rotate(-7deg); }
  .s2 { left: 790px; top: 150px; width: 390px; height: 360px; transform: rotate(4deg); }
  .s3 { left: 650px; top: 300px; width: 400px; height: 420px; transform: rotate(-2deg); }
</style></head>
<body><div class="card">
  <div class="shot s1"><img src="3-shots/parties.png" alt=""></div>
  <div class="shot s2"><img src="3-shots/catalog.png" alt=""></div>
  <div class="shot s3"><img src="3-shots/consent.png" alt=""></div>
  <div class="copy">
    <div class="top"><img src="logo-mark.svg" alt=""><div class="brand">EUDI Dev Wallet</div></div>
    <h1>eudi-dev<span>3</span></h1>
    <div class="sub">Test the trust side of the EUDI Wallet ecosystem</div>
    <div class="chips"><span>Registrar</span><span>ARF checks</span><span>Trusted lists</span><span>Attestation catalogue</span></div>
  </div>
  <div class="site">eudi-test.dev</div>
</div></body></html>
