# Public demo deployment: Caddy terminates TLS for the public domain and
# proxies to the wallet. The wallet runs as a public demo (see docs/public-demo.md).
#
# 1. Point your domain's DNS at this host.
# 2. Replace eudi-test.dev in this file and in Caddyfile with your domain.
# 3. Put your operator details into imprint.html.
# 4. Create stats.env with the /stats credentials (./deploy.sh stats-password).
# 5. docker compose up -d
#
# Limit container logs so they cannot grow indefinitely.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # The local Dockerfile adds the rate limiting plugin required by Caddyfile.
    build: .
    image: eudi-demo-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    # deploy.sh writes escaped bcrypt hashes to stats.env for Compose to load.
    env_file:
      - path: stats.env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      - stats-report:/srv/stats:ro

  wallet:
    # WALLET_TAG in the host .env pins a release for rollback. Without a pin, use the
    # latest release.
    image: ghcr.io/eudi-dev/eudi-dev:${WALLET_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # The demo persists: files on the mounted volume and its own random keys.
    # Visitors confirm each browser flow. The image default skips that step. The
    # image lets the wallet reach private networks. A public demo must not.
    environment:
      EUDI_DEV_STORAGE: file
      EUDI_DEV_SEED: ""
      EUDI_DEV_AUTO_ACCEPT: "false"
      EUDI_DEV_ALLOW_PRIVATE_NETWORKS: "false"
    # No published ports: only Caddy reaches the wallet.
    command:
      - wallet
      - serve
      - --demo
      - --demo-reset
      # Wall-clock schedule: the reset lands at the same local time every day.
      - 00:00 Europe/Berlin
      - --port
      - "8085"
      - --base-url
      - https://eudi-test.dev
      # Keep client identity and callback URLs stable for issuers that register this
      # wallet.
      - --vci-client-id
      - https://eudi-test.dev
      - --vci-redirect-uri
      - https://eudi-test.dev/callback
      - --status-list
      - --imprint-file
      - /config/imprint.html
      - --news-file
      - /config/news/news.html
    volumes:
      # The shared CA lives one level above the wallet directory and must
      # survive restarts, so the parent directory is mounted.
      - wallet-data:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro
      - ./news:/config/news:ro

  # The preview host runs the newest release, betas included, with its own URL
  # and data volume.
  wallet-preview:
    image: ghcr.io/eudi-dev/eudi-dev:${PREVIEW_TAG:-beta}
    restart: unless-stopped
    logging: *logging
    # The demo persists: files on the mounted volume and its own random keys.
    # Visitors confirm each browser flow. The image default skips that step. The
    # image lets the wallet reach private networks. A public demo must not.
    environment:
      EUDI_DEV_STORAGE: file
      EUDI_DEV_SEED: ""
      EUDI_DEV_AUTO_ACCEPT: "false"
      EUDI_DEV_ALLOW_PRIVATE_NETWORKS: "false"
    # Only ./deploy.sh preview starts it. A production up or push leaves it
    # alone.
    profiles: ["preview"]
    command:
      - wallet
      - serve
      - --demo
      - --demo-reset
      - 00:00 Europe/Berlin
      - --port
      - "8085"
      - --base-url
      - https://preview.eudi-test.dev
      - --vci-client-id
      - https://preview.eudi-test.dev
      - --vci-redirect-uri
      - https://preview.eudi-test.dev/callback
      - --status-list
      - --imprint-file
      - /config/imprint.html
      # The preview shows the news of its own release.
      - --news-file
      - /config/news/news-3.0.0.html
    volumes:
      - wallet-data-preview:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro
      - ./news:/config/news:ro

  # The conformance wallet runs strict mode with auto-accept for the hosted OIDF suite.
  # STRICT_TAG selects its release independently. See docs/conformance-run.md.
  wallet-strict:
    image: ghcr.io/eudi-dev/eudi-dev:${STRICT_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    # Persist files and randomly generated keys on the mounted volume. The
    # public host reaches no private network.
    environment:
      EUDI_DEV_STORAGE: file
      EUDI_DEV_SEED: ""
      EUDI_DEV_ALLOW_PRIVATE_NETWORKS: "false"
    # Only ./deploy.sh strict starts it. A production up or push leaves it
    # alone.
    profiles: ["strict"]
    # The harness accesses management endpoints through an SSH tunnel to this loopback
    # port. Caddy restricts the public routes.
    ports:
      - "127.0.0.1:18086:8085"
    command:
      - wallet
      - serve
      - --mode
      - strict
      - --haip
      - --auto-accept
      - --pid
      - --preferred-format
      - dc+sd-jwt
      - --port
      - "8085"
      - --base-url
      - https://strict.eudi-test.dev
      # Keep the callback alias in sync with OIDF_VCI_ALIAS=oid4vc-dev-vci-strict.
      - --vci-client-id
      - "52480754053"
      - --vci-redirect-uri
      - https://www.certification.openid.net/test/a/oid4vc-dev-vci-strict/callback
      - --imprint-file
      - /config/imprint.html
    volumes:
      - wallet-data-strict:/home/app/.eudi-dev
      - ./imprint.html:/config/imprint.html:ro

  # Build an HTML usage report from the anonymized access log without adding tracking code
  # to pages.
  stats:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Caddy creates the log on its first request. Skip reporting until the file
        # exists.
        while true; do
          if [ -s /var/log/caddy/access.log ]; then
            goaccess /var/log/caddy/access.log \
              --log-format=CADDY \
              --ignore-crawlers --anonymize-ip \
              --html-report-title="Demo usage" \
              -o /srv/stats/report.html || true
          fi
          sleep 120
        done
    volumes:
      - caddy-logs:/var/log/caddy:ro
      - stats-report:/srv/stats

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  stats-report:
  wallet-data:
  # deploy.sh creates these volumes with uid 1000 ownership before Compose attaches them.
  wallet-data-preview:
    name: eudi-demo_wallet-data-preview
    external: true
  wallet-data-strict:
    name: eudi-demo_wallet-data-strict
    external: true
