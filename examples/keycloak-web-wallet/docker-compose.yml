# Services share a network namespace so localhost URLs work in containers and the browser.
# Published ports must match listener ports. start.sh selects available defaults, and
# environment overrides can fix them.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      - --import-realm
      # The create-credential-offer REST endpoint needs its own feature flag.
      - --features=oid4vc-vci:v1,oid4vc-vci-preauth-code:v1,oid4vc-vci-rest-credential-offer:v1
      - --http-port=${KEYCLOAK_PORT:-9080}
      - --proxy-headers=xforwarded
      # The wallet CA (exported by start.sh) lets Keycloak fetch the wallet's
      # HTTPS status-list endpoint during credential revocation checks.
      - --truststore-paths=/opt/keycloak/conf/oid4vc-wallet-ca.pem
      - --tls-hostname-verifier=ANY
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info,de.arbeitsagentur:trace
    ports:
      - "${KEYCLOAK_PORT:-9080}:${KEYCLOAK_PORT:-9080}"
      - "${WALLET_PORT:-9085}:${WALLET_PORT:-9085}"
      - "${APP_PORT:-9090}:${APP_PORT:-9090}"
    volumes:
      - ./providers:/opt/keycloak/providers:ro
      - ./wallet-ca-cert.pem:/opt/keycloak/conf/oid4vc-wallet-ca.pem:ro
      - ./realm:/opt/keycloak/data/import:ro

  wallet:
    build: ../..
    # File storage on the mounted volume with random keys. The user confirms
    # each flow, which the image default skips.
    environment:
      EUDI_DEV_STORAGE: file
      EUDI_DEV_SEED: ""
      EUDI_DEV_AUTO_ACCEPT: "false"
      # The image health check probes this port.
      EUDI_DEV_PORT: "${WALLET_PORT:-9085}"
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    command:
      - wallet
      - serve
      - --pid
      - --base-url
      - http://localhost:${WALLET_PORT:-9085}
    volumes:
      # Persist the exported CA so the wallet uses the same certificate that Keycloak
      # trusts.
      - wallet-data:/home/app/.eudi-dev

  # Export the CA before Keycloak starts. The wallet service cannot start first because it
  # joins Keycloak's network namespace.
  wallet-init:
    profiles: ["setup"]
    build: ../..
    # File storage on the mounted volume with random keys.
    environment:
      EUDI_DEV_STORAGE: file
      EUDI_DEV_SEED: ""
    network_mode: "none"
    volumes:
      - wallet-data:/home/app/.eudi-dev

  app:
    build: ./demo
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    command: ["/app/app.py"]
    environment:
      KEYCLOAK_BASE_URL: http://localhost:${KEYCLOAK_PORT:-9080}
      WALLET_BASE_URL: http://localhost:${WALLET_PORT:-9085}
      APP_LISTEN_PORT: ${APP_PORT:-9090}
      APP_BASE_URL: http://localhost:${APP_PORT:-9090}
    volumes:
      - ./scripts:/scripts:ro
      - ./app:/app:ro

  demo:
    profiles: ["demo"]
    build: ./demo
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_BASE_URL: http://localhost:${KEYCLOAK_PORT:-9080}
      WALLET_BASE_URL: http://localhost:${WALLET_PORT:-9085}
    volumes:
      - ./scripts:/scripts:ro

volumes:
  wallet-data:
